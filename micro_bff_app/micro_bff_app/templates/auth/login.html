{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo-full.png') }}" alt="Eduflex" style="max-width: 320px; width: 100%; height: auto;">
        </div>
        <h2 class="mb-4 text-center">Ingresar</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i>Ingresar</button>
        </form>
        <p class="mt-3">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
    </div>
</div>
{% endblock %}
